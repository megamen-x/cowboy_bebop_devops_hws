version: '3.8'

x-environment-defaults: &env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__WEBSERVER__RBAC: 'true'
  AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=}
  AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: 'true'
  _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
  _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin123}

x-airflow-common: &airflow-common
  build: .
  environment: *env
  user: root
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./spark:/opt/airflow/spark
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 30s

services:
  loki: # логирование с помощью loki
    image: grafana/loki:3.2.0
    container_name: loki
    ports:
    - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:v1.5.1
    volumes:
    - ./logs:/opt/logs
    - ./alloy.conf:/etc/alloy/config.alloy
    command:
    - run
    - --server.http.listen-addr=0.0.0.0:12345
    - /etc/alloy/config.alloy

  grafana: # визуализация логирования
    image: grafana/grafana:11.2.0
    ports:
    - "3000:3000"
    environment:
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_PATHS_PROVISIONING=/etc/grafana/provisioning

  prometheus:  # логирование с помощью prometheus
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    ports:
    - "9090:9090"
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  spark-master:
    container_name: spark-master
    image: apache/spark:3.5.0
    ports:
      - '4040:8080'
      - '7077:7077'
    command: '/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master'
    restart: always

  spark-worker:
    container_name: spark-worker
    image: apache/spark:3.5.0
    depends_on:
      - spark-master
    ports:
      - "7000:7000"
    command: '/opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077'
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      spark-worker:
        condition: service_started
    healthcheck:
      disable: true

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      spark-worker:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      spark-worker:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully



volumes:
  postgres-db-volume:
