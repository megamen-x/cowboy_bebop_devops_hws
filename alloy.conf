local.file_match "airflow_logs" {
    path_targets = [
        {"__path__" = "/opt/logs/dag_id=*/run_id=*/task_id=*/*.log", "job" = "airflow_logs"}, // по маске ищем нужные логи
    ]
}

loki.source.file "airflow" {
    targets = local.file_match.airflow_logs.targets
    forward_to = [loki.write.default.receiver] // отправка собранных логов в дефолтный ресивер Loki
}

loki.write "default" { // дефолтный ресивер Loki
    endpoint {
        url = "http://loki:3100/loki/api/v1/push" // адрес может отличаться (container_name)
    }
}