name: Github CI pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Проверка существования директорий
        run: |
          if [ -d "dags" ] && [ -d "spark" ]; then
            echo "Все тесты пройдены!"
          else
            echo "Тесты не пройдены! Отсутствуют папки 'dags/' или 'spark/'."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    if: |
      !contains(github.ref_name, 'feature/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cowboy_bebop_lab:latest .
          echo "Билд успешно завершен!"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref_name == 'main' || 
      github.ref_name == 'master' || 
      github.ref_name == 'develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          echo "Деплой на сервер..."
          docker-compose up -d
          echo "Приложение успешно задеплоено!"

  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    if: |
      github.ref_name == 'main' || 
      github.ref_name == 'master' || 
      github.ref_name == 'develop'
    environment: production
    steps:
      - name: Cleanup
        run: |
          docker-compose rm -sf
          echo "Очистка завершена"
